<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>xiaolanshu 本地调试台</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; background: #f4f6f8; color: #17212b; }
    body { max-width: 980px; margin: 0 auto; padding: 28px 18px 48px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 28px; }
    .muted { color: #687585; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    section { background: #fff; border: 1px solid #dde3e9; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px #17212b0d; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    label { display: block; color: #536273; font-size: 12px; margin: 10px 0 5px; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #cbd5df; border-radius: 5px; padding: 9px 10px; font: inherit; }
    textarea { min-height: 92px; resize: vertical; }
    button { border: 0; border-radius: 5px; padding: 9px 13px; color: white; background: #e04f39; cursor: pointer; margin-top: 12px; }
    button.secondary { background: #52677d; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f9fb; border: 1px solid #e2e7ec; border-radius: 5px; padding: 10px; min-height: 46px; }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header>
    <div><h1>xiaolanshu</h1><div class="muted">本地接口调试台 · chisa</div></div>
    <button class="secondary" onclick="loadNotes()">刷新笔记</button>
  </header>
  <div class="grid">
    <section>
      <h2>登录 / 自动注册</h2>
      <label>手机号</label><input id="phone" value="18011119108">
      <label>验证码</label><input id="code" value="123456">
      <button onclick="login()">登录</button>
      <pre id="loginResult">尚未登录</pre>
    </section>
    <section>
      <h2>发布笔记</h2>
      <label>标题</label><input id="title" value="我的第一篇 xiaolanshu 笔记">
      <label>正文</label><textarea id="content">从教程主链路开始联调。</textarea>
      <button onclick="publish()">发布</button>
      <pre id="publishResult">需要先登录</pre>
    </section>
    <section class="wide">
      <h2>笔记列表</h2>
      <pre id="notes">点击右上角刷新笔记</pre>
    </section>
  </div>
  <script>
    let token = '';
    const $ = id => document.getElementById(id);
    const json = value => JSON.stringify(value, null, 2);
    async function login() {
      await fetch('/api/auth/send-code', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: $('phone').value}) });
      const response = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: $('phone').value, code: $('code').value, type: 1}) });
      const data = await response.json();
      token = data.data?.token || '';
      $('loginResult').textContent = json(data);
    }
    async function publish() {
      const response = await fetch('/api/notes/publish', { method: 'POST', headers: {'Content-Type': 'application/json', Authorization: `Bearer ${token}`}, body: JSON.stringify({title: $('title').value, content: $('content').value, imageUris: []}) });
      $('publishResult').textContent = json(await response.json());
      await loadNotes();
    }
    async function loadNotes() {
      const response = await fetch('/api/notes');
      $('notes').textContent = json(await response.json());
    }
  </script>
</body>
</html>
