services:
  redis:
    image: redis:7.2
    container_name: xiaolanshu-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting Docker}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - xiaolanshu-redis-data:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: xiaolanshu-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: xiaolanshu-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.0.0
    container_name: xiaolanshu-rocketmq-dashboard
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=rocketmq-namesrv:9876
    ports:
      - "8081:8080"

volumes:
  xiaolanshu-redis-data:
